name: MHub
description: >-
  MHub is a Malaysian property-technology (proptech) platform operated by TRB
  Ventures Sdn Bhd and backed by 500 Global. It gives real-estate developers an
  integrated system to manage the entire new-property sales cycle — from lead
  generation, launch, and online booking (Showroom, CRM, SalesCandy) through
  automated billing and collections (Credit Control), accounting and financial
  reporting, statutory compliance (HIMS/KPKT registry synchronization and
  LHDN-compliant e-invoicing), commission control, and handover/defect
  management. MHub runs a developer portal at developer.mhub.my and an
  authentication-gated REST API at api.mhub.my for platform integrations.
